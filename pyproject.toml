[project]
name = "tcgnecro"
version = "0.1.0"
description = "Deck builder and proxy printer for out-of-print card games"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    # Upper bounds stop a new major version reaching the Docker image untested.
    # Raise them deliberately, after running the tests (docs/DOCKER.md).
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "jinja2>=3.1,<4",
    "pillow>=11,<13",
    # 2.0 added a bundled ML layout module (numpy, onnxruntime) that we don't
    # use, and current numpy needs an x86-64-v2 CPU, which some servers lack.
    "pymupdf>=1.24,<2",
    "python-multipart>=0.0.9,<1",  # HTML form posts in the deck builder
    "itsdangerous>=2,<3",          # signed session cookies (Starlette SessionMiddleware)
    "tzdata",                      # time zone names where the OS has none (e.g. slim Docker images)
    "pyjwt[crypto]>=2.8,<3",       # verifying Cloudflare Access sign-in tokens (auth.py)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]  # httpx: FastAPI's TestClient

[project.scripts]
tcgnecro = "tcgnecro.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tcgnecro*"]

[tool.setuptools.package-data]
tcgnecro = [
    "templates/*.html",
    "static/*",
    "deckbuilder/templates/*.html",
    "games/*/*.json",
    "games/*/*.toml",
    "games/*/backs/*",
]
