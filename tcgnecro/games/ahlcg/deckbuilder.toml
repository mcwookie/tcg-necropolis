# there work. Any key of the card's attrs or ArkhamDB data also works as is.
# Reference: docs/BUILDQL.md.

[query]
text_fields = ["text", "flavor", "back_text", "real_text", "customization_text"]

[query.split]
traits = "."
tags = "."

