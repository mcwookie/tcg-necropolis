[project]
name = "tcgnecro"
version = "0.1.0"
description = "Deck builder and proxy printer for out-of-print card games"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pillow",
    "pymupdf",
    "python-multipart",  # HTML form posts in the deck builder
    "itsdangerous",      # signed session cookies (Starlette SessionMiddleware)
    "tzdata",            # time zone names where the OS has none (e.g. slim Docker images)
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]  # httpx: FastAPI's TestClient

[project.scripts]
tcgnecro = "tcgnecro.cli:main"

[build-system]
requires = ["setuptools>=77"]  # SPDX `license` string (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tcgnecro*"]

[tool.setuptools.package-data]
tcgnecro = [
    "templates/*.html",
    "static/*",
    "deckbuilder/templates/*.html",
    "games/*/*.json",
    "games/*/*.toml",
    "games/*/backs/*",
]
