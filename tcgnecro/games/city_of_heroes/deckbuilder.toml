# ---- Sort orders; the first is the default ---------------------------------

[[sorts]]
key = "kind"
label = "Type, name"
fields = ["kind", "name"]

[[sorts]]
key = "name"
label = "Name"
fields = ["name"]

[[sorts]]
key = "powerset"
label = "Powerset, name"
fields = ["powersets", "name"]
