# Arkham Horror LCG deck builder config.
#
# Data only: what the filter panel offers and its defaults, how cards look,
# how the deck list is grouped. Rules live in deckbuilder.py.
# Field reference: docs/DECKBUILDER.md ("Config reference").
#
# The `field` names below are keys of DeckCard.attrs, which
# AhlcgPlugin.build_card fills in.

identity_label = "Investigator"
default_copies = 2
color_field = "faction"
subtitle_field = "traits"
group_field = "kind"
page_size = 100

[colors]
guardian = "#2b80c5"
seeker = "#e0802a"
rogue = "#1f8a3a"
mystic = "#6a4fd1"
survivor = "#cc3038"
neutral = "#8a8a84"
mythos = "#555555"

[[badges]]
field = "cost"
title = "Cost"

[[badges]]
field = "pips"
title = "Level (experience)"

[[groups]]
value = "asset"
label = "Assets"

[[groups]]
value = "event"
label = "Events"

[[groups]]
value = "skill"
label = "Skills"

[[groups]]
value = "story"
label = "Campaign cards"

[[groups]]
value = "weakness"
label = "Weaknesses"

# ---- Filters, top to bottom as shown ---------------------------------------

[[filters]]
key = "legal"
label = "Only cards my investigator can take"
type = "toggle"
default = true

[[filters]]
key = "owned"
label = "Only cards I own"
type = "toggle"
# Handled by the core (filters.py), not the plugin. Starts switched on once
# the profile has saved a collection on the Collection page.
default = false

[[filters]]
key = "q"
label = "Search"
type = "text"
fields = ["name", "traits", "text"]
help = "Matches name, traits and card text"

[[filters]]
key = "faction"
label = "Class"
type = "multiselect"
field = "factions"
default = []
options = [
  { value = "guardian", label = "Guardian", color = "#2b80c5" },
  { value = "seeker",   label = "Seeker",   color = "#e0802a" },
  { value = "rogue",    label = "Rogue",    color = "#1f8a3a" },
  { value = "mystic",   label = "Mystic",   color = "#6a4fd1" },
  { value = "survivor", label = "Survivor", color = "#cc3038" },
  { value = "neutral",  label = "Neutral",  color = "#8a8a84" },
]

[[filters]]
key = "kind"
label = "Type"
type = "multiselect"
field = "kind"
# Weaknesses and story (campaign) cards are hidden until asked for; they're
# added by requirement, at random, or when a campaign says so.
default = ["asset", "event", "skill"]
options = [
  { value = "asset",    label = "Asset" },
  { value = "event",    label = "Event" },
  { value = "skill",    label = "Skill" },
  { value = "weakness", label = "Weakness" },
  { value = "story",    label = "Story / campaign" },
]

[[filters]]
key = "level"
label = "Level"
type = "range"
field = "xp"
min = 0
max = 5
default = [0, 5]

[[filters]]
key = "cost"
label = "Cost"
type = "range"
field = "cost"
min = 0
max = 10
# Skills and X-cost cards have no cost; keep them unless the range is narrowed.
none_passes = true

[[filters]]
key = "slot"
label = "Slot"
type = "multiselect"
field = "slots"
options = [
  { value = "Hand",      label = "Hand" },
  { value = "Hand x2",   label = "Hand ×2" },
  { value = "Arcane",    label = "Arcane" },
  { value = "Arcane x2", label = "Arcane ×2" },
  { value = "Accessory", label = "Accessory" },
  { value = "Body",      label = "Body" },
  { value = "Ally",      label = "Ally" },
  { value = "Tarot",     label = "Tarot" },
]

[[filters]]
key = "skill"
label = "Skill icons"
type = "multiselect"
field = "skill_icons"
options = [
  { value = "willpower", label = "Willpower" },
  { value = "intellect", label = "Intellect" },
  { value = "combat",    label = "Combat" },
  { value = "agility",   label = "Agility" },
  { value = "wild",      label = "Wild" },
]

# ---- Sort orders; the first is the default ---------------------------------

[[sorts]]
key = "class"
label = "Class, name"
fields = ["faction", "name"]

[[sorts]]
key = "name"
label = "Name"
fields = ["name"]

[[sorts]]
key = "level"
label = "Level, name"
fields = ["xp", "name"]

[[sorts]]
key = "cost"
label = "Cost, name"
fields = ["cost", "name"]

