[project]
name = "tcgnecro"
version = "0.1.0"
description = "Card game proxy PDFs from local image collections"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "pillow",
    "pymupdf",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
tcgnecro = "tcgnecro.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tcgnecro*"]

[tool.setuptools.package-data]
tcgnecro = ["templates/*.html", "games/*/*.json", "games/*/backs/*"]
