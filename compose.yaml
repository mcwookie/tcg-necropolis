# TCG Necropolis with Docker Compose. See docs/DOCKER.md.
#
#   docker compose up -d                    # the app on http://127.0.0.1:8000
#   docker compose --profile https up -d    # plus Caddy: HTTPS + password gate
#
# Settings come from a .env file next to this one (copy deploy/env.example).

services:
  app:
    # Published by .github/workflows/docker.yml on every push to main.
    # `docker compose up --build` builds from this checkout instead.
    image: ${TCGNECRO_IMAGE:-ghcr.io/mcwookie/tcg-necropolis:latest}
    build: .
    restart: unless-stopped
    # Run as the owner of the data folder so files stay editable on the host.
    user: "${TCGNECRO_UID:-1000}:${TCGNECRO_GID:-1000}"
    volumes:
      - ${TCGNECRO_DATA_DIR:-./data}:/data
    environment:
      # 1 when people reach the app over HTTPS (Caddy below, or a tunnel).
      TCGNECRO_SECURE_COOKIES: ${TCGNECRO_SECURE_COOKIES:-0}
      TCGNECRO_SOURCE_URL: ${TCGNECRO_SOURCE_URL:-https://github.com/mcwookie/tcg-necropolis}
      # Trust X-Forwarded-* headers from the Caddy container.
      FORWARDED_ALLOW_IPS: "*"
    ports:
      # Only this machine by default. Caddy reaches the app over the compose
      # network; for direct LAN access set TCGNECRO_BIND=0.0.0.0.
      - "${TCGNECRO_BIND:-127.0.0.1}:${TCGNECRO_PORT:-8000}:8000"

  caddy:
    image: caddy:2
    profiles: ["https"]
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      # Your domain (set in .env). The localhost fallback gets a local,
      # self-signed certificate, which is only useful for trying it out.
      TCGNECRO_DOMAIN: ${TCGNECRO_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-users:/etc/caddy/users:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:     # certificates; keep it, or Let's Encrypt rate limits can bite
  caddy_config:
