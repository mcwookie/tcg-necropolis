{# A game's logo: its image from static/logos/, or a text tile (LOGO_TILE). #}
{% macro logo(game, cls="") -%}
{% if game.logo_url %}
<img class="logo {{ cls }}" src="{{ game.logo_url }}" alt="{{ game.name }}">
{% else %}
{% set title, subtitle, bg, fg = game.tile %}
<div class="logo tile-text {{ cls }}" style="--logo-bg: {{ bg }}; --logo-fg: {{ fg }}" role="img" aria-label="{{ game.name }}">
  <span class="t">{{ title }}</span>{% if subtitle %}<span class="s">{{ subtitle }}</span>{% endif %}
</div>
{% endif %}
{%- endmacro %}
