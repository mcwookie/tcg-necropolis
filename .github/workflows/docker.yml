# On every push to main: run the tests, check the image starts on an older
# x86-64 CPU (deploy/check-old-cpu.sh), then publish it to GitHub Container
# Registry as
#   ghcr.io/<owner>/<repo>:latest    and    :sha-<commit>
# Servers pick up :latest with deploy/update.sh (see docs/DOCKER.md).
name: Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-image
  cancel-in-progress: true   # a newer push supersedes an unfinished build

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e '.[dev]'
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      # arm64 too, for ARM servers (e.g. Oracle Cloud's free tier). Remove
      # linux/arm64 below (and this step) for faster builds if you don't need it.
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
      # Gate: the image must start on an older x86-64 CPU (no x86-64-v2), as
      # some servers have. Build amd64 onto the runner, check it, and only then
      # publish. The publish step below reuses this build's cache.
      - name: Build amd64 image for the CPU check
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: tcgnecro:check
          cache-from: type=gha
      - name: Check it starts on an x86-64-v1 CPU
        run: deploy/check-old-cpu.sh tcgnecro:check
      - name: Build and publish
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
